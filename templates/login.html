<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AURA AI Public Health Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Animated Moving Medical Particles Background -->
    <div class="medical-bg">
        <div class="bg-particle-med anim-med-1" style="top: 10%; left: 8%;">🩺</div>
        <div class="bg-particle-med anim-med-2" style="top: 18%; left: 85%;">💊</div>
        <div class="bg-particle-med anim-med-3" style="top: 30%; left: 50%;">🧬</div>
        <div class="bg-particle-med anim-med-1" style="top: 65%; left: 15%;">💓</div>
        <div class="bg-particle-med anim-med-2" style="top: 72%; left: 80%;">➕</div>
        <div class="bg-particle-med anim-med-3" style="top: 85%; left: 40%;">🔬</div>
        <div class="bg-orb" style="top: 15%; left: 10%; width: 260px; height: 260px; background: radial-gradient(circle, rgba(2,132,199,0.18) 0%, transparent 70%);"></div>
        <div class="bg-orb" style="top: 60%; left: 70%; width: 280px; height: 280px; background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 70%);"></div>
    </div>

    <!-- Top Minimal Navbar -->
    <header class="main-navbar" style="padding: 0 24px;">
        <div class="nav-left">
            <a href="/" class="logo" style="text-decoration: none;">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="pulse-icon"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                <span data-i18n="nav_brand">AURA Platform</span>
            </a>
            <div class="badge offline-badge" data-i18n="badge_offline">Local Offline</div>
        </div>

        <div class="nav-right">
            <!-- Language Dropdown (English, Hindi, Telugu only) -->
            <select id="standalone-lang-selector" class="lang-dropdown">
                <option value="en" selected>English</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="te">తెలుగు (Telugu)</option>
            </select>

            <a href="/" class="btn btn-secondary" style="font-size: 0.76rem; text-decoration: none; padding: 6px 14px;" data-i18n="nav_home">← Back to Home</a>
            <a href="/signup" class="btn btn-primary" style="font-size: 0.76rem; text-decoration: none; padding: 6px 14px;" data-i18n="auth_tab_signup">Sign Up</a>
        </div>
    </header>

    <!-- Centered Login Card -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 15px; z-index: 10;">
        <div class="auth-page-card">
            <div class="auth-page-header">
                <div class="auth-icon-badge">🔐</div>
                <h2 data-i18n="auth_tab_login">Sign In</h2>
                <p data-i18n="login_subtitle">Access your offline medical history, biometrics telemetry, and medication schedule.</p>
            </div>
            
            <form id="standalone-login-form" class="auth-form">
                <div class="form-group">
                    <label data-i18n="auth_lbl_email">Email / Roll Number</label>
                    <input type="text" id="login-id-input" placeholder="e.g. 241801370052 or email" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label data-i18n="auth_lbl_password">Password</label>
                    <input type="password" id="login-pw-input" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary auth-submit-btn" data-i18n="auth_btn_login">Sign In</button>
                
                <div style="text-align: center; margin: 10px 0; font-size: 0.75rem; color: var(--text-muted);" data-i18n="auth_or">OR</div>
                
                <button type="button" class="btn btn-secondary" id="standalone-guest-btn" style="width: 100%; padding: 10px; font-size: 0.82rem;" data-i18n="auth_btn_guest">Continue as Guest</button>
            </form>

            <div class="auth-footer-links">
                <span data-i18n="auth_no_account">Don't have an account?</span> 
                <a href="/signup" class="auth-link" data-i18n="auth_link_signup">Create an Account →</a>
            </div>

            <!-- Hackathon 1-Click Demo Accounts -->
            <div class="demo-credentials-box">
                <div class="demo-title" data-i18n="demo_accounts_title">⚡ 1-Click Hackathon Demo Profiles</div>
                <div class="demo-chips-grid">
                    <button type="button" class="demo-chip-btn" onclick="fillDemo('S. Pallavi', '241801370052')">
                        <strong>S. Pallavi</strong>
                        <span>Roll: 241801370052</span>
                    </button>
                    <button type="button" class="demo-chip-btn" onclick="fillDemo('B. Anusha', '241801370055')">
                        <strong>B. Anusha</strong>
                        <span>Roll: 241801370055</span>
                    </button>
                    <button type="button" class="demo-chip-btn" onclick="fillDemo('Y. Niharika', '241801370009')">
                        <strong>Y. Niharika</strong>
                        <span>Roll: 241801370009</span>
                    </button>
                    <button type="button" class="demo-chip-btn" onclick="fillDemo('G. Parwathi', '241801370061')">
                        <strong>G. Parwathi</strong>
                        <span>Roll: 241801370061</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const AUTH_LANGS = {
            en: {
                nav_brand: "AURA Platform",
                badge_offline: "Local Offline",
                nav_home: "← Back to Home",
                auth_tab_login: "Sign In",
                auth_tab_signup: "Sign Up",
                login_subtitle: "Access your offline medical history, biometrics telemetry, and medication schedule.",
                auth_lbl_email: "Email / Roll Number",
                auth_lbl_password: "Password",
                auth_btn_login: "Sign In",
                auth_or: "OR",
                auth_btn_guest: "Continue as Guest",
                auth_no_account: "Don't have an account?",
                auth_link_signup: "Create an Account →",
                demo_accounts_title: "⚡ 1-Click Hackathon Demo Profiles"
            },
            hi: {
                nav_brand: "ऑरा प्लेटफॉर्म (AURA)",
                badge_offline: "ऑफ़लाइन मोड",
                nav_home: "← होम पर वापस जाएं",
                auth_tab_login: "साइन इन (Login)",
                auth_tab_signup: "नया खाता बनाएं",
                login_subtitle: "अपने ऑफ़लाइन मेडिकल रिकॉर्ड, वाइटल्स और दवा शेड्यूल तक पहुंचें।",
                auth_lbl_email: "ईमेल / रोल नंबर",
                auth_lbl_password: "पासवर्ड",
                auth_btn_login: "लॉगिन करें",
                auth_or: "या",
                auth_btn_guest: "अतिथि (Guest) के रूप में जारी रखें",
                auth_no_account: "खाता नहीं है?",
                auth_link_signup: "नया खाता बनाएं →",
                demo_accounts_title: "⚡ 1-क्लिक डेमो प्रोफाइल"
            },
            te: {
                nav_brand: "AURA ప్లాట్‌ఫామ్",
                badge_offline: "ఆఫ్‌లైన్ మోడ్",
                nav_home: "← హోమ్‌కి తిరిగి వెళ్లండి",
                auth_tab_login: "సైన్ ఇన్ (Login)",
                auth_tab_signup: "ఖాతా తెరవండి",
                login_subtitle: "మీ ఆఫ్‌లైన్ మెడికల్ రికార్డులు, వైటల్స్ మరియు మందుల షెడ్యూల్‌ని యాక్సెస్ చేయండి.",
                auth_lbl_email: "ఈమెయిల్ / రోల్ నంబర్",
                auth_lbl_password: "పాస్‌వర్డ్",
                auth_btn_login: "లాగిన్ చేయండి",
                auth_or: "లేదా",
                auth_btn_guest: "గెస్ట్‌గా కొనసాగండి",
                auth_no_account: "ఖాతా లేదా?",
                auth_link_signup: "ఖాతా సృష్టించండి →",
                demo_accounts_title: "⚡ 1-క్లిక్ డెమో ప్రొఫైల్స్"
            }
        };

        function setAuthLanguage(lang) {
            const dict = AUTH_LANGS[lang] || AUTH_LANGS.en;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const k = el.getAttribute("data-i18n");
                if (dict[k]) el.textContent = dict[k];
            });
            localStorage.setItem("aura_lang", lang);
        }

        const langSel = document.getElementById("standalone-lang-selector");
        if (langSel) {
            const saved = localStorage.getItem("aura_lang") || "en";
            langSel.value = saved;
            setAuthLanguage(saved);
            langSel.addEventListener("change", (e) => setAuthLanguage(e.target.value));
        }

        function fillDemo(name, roll) {
            document.getElementById("login-id-input").value = roll;
            document.getElementById("login-pw-input").value = "demo123";
            doLogin(name, roll);
        }

        function doLogin(name, id) {
            const user = { name: name, identifier: id };
            localStorage.setItem("aura_active_user", JSON.stringify(user));
            window.location.href = "/";
        }

        document.getElementById("standalone-login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const id = document.getElementById("login-id-input").value.trim();
            const name = id.includes("@") ? id.split("@")[0] : id;
            doLogin(name, id);
        });

        document.getElementById("standalone-guest-btn").addEventListener("click", () => {
            doLogin("Guest Patient", "guest");
        });
    </script>
</body>
</html>
