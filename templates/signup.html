<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AURA AI Public Health Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Animated Moving Medical Particles Background -->
    <div class="medical-bg">
        <div class="bg-particle-med anim-med-1" style="top: 10%; left: 8%;">🩺</div>
        <div class="bg-particle-med anim-med-2" style="top: 18%; left: 85%;">💊</div>
        <div class="bg-particle-med anim-med-3" style="top: 30%; left: 50%;">🧬</div>
        <div class="bg-particle-med anim-med-1" style="top: 65%; left: 15%;">💓</div>
        <div class="bg-particle-med anim-med-2" style="top: 72%; left: 80%;">➕</div>
        <div class="bg-particle-med anim-med-3" style="top: 85%; left: 40%;">🔬</div>
        <div class="bg-orb" style="top: 15%; left: 10%; width: 260px; height: 260px; background: radial-gradient(circle, rgba(2,132,199,0.18) 0%, transparent 70%);"></div>
        <div class="bg-orb" style="top: 60%; left: 70%; width: 280px; height: 280px; background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 70%);"></div>
    </div>

    <!-- Top Minimal Navbar -->
    <header class="main-navbar" style="padding: 0 24px;">
        <div class="nav-left">
            <a href="/" class="logo" style="text-decoration: none;">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="pulse-icon"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                <span data-i18n="nav_brand">AURA Platform</span>
            </a>
            <div class="badge offline-badge" data-i18n="badge_offline">Local Offline</div>
        </div>

        <div class="nav-right">
            <!-- Language Dropdown (English, Hindi, Telugu only) -->
            <select id="standalone-lang-selector" class="lang-dropdown">
                <option value="en" selected>English</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="te">తెలుగు (Telugu)</option>
            </select>

            <a href="/" class="btn btn-secondary" style="font-size: 0.76rem; text-decoration: none; padding: 6px 14px;" data-i18n="nav_home">← Back to Home</a>
            <a href="/login" class="btn btn-secondary" style="font-size: 0.76rem; text-decoration: none; padding: 6px 14px;" data-i18n="auth_tab_login">Sign In</a>
        </div>
    </header>

    <!-- Centered Sign Up Card -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 15px; z-index: 10;">
        <div class="auth-page-card">
            <div class="auth-page-header">
                <div class="auth-icon-badge">📝</div>
                <h2 data-i18n="auth_tab_signup">Create Patient Profile</h2>
                <p data-i18n="signup_subtitle">Set up your personal offline digital health profile with clinical baseline records.</p>
            </div>
            
            <form id="standalone-signup-form" class="auth-form">
                <div class="form-group">
                    <label data-i18n="auth_lbl_name">Full Name</label>
                    <input type="text" id="signup-name-input" placeholder="e.g. S. Pallavi" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label data-i18n="auth_lbl_age">Age</label>
                        <input type="number" id="signup-age-input" placeholder="21" min="1" max="120" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label data-i18n="auth_lbl_blood">Blood Group</label>
                        <select id="signup-blood-input">
                            <option value="O+">O+</option>
                            <option value="A+">A+</option>
                            <option value="B+">B+</option>
                            <option value="AB+">AB+</option>
                            <option value="O-">O-</option>
                            <option value="A-">A-</option>
                            <option value="B-">B-</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="auth_lbl_email">Email / Roll Number</label>
                    <input type="text" id="signup-id-input" placeholder="e.g. 241801370052 or email" required>
                </div>
                <div class="form-group">
                    <label data-i18n="auth_lbl_password">Password</label>
                    <input type="password" id="signup-pw-input" placeholder="Create a secure password" required>
                </div>
                <button type="submit" class="btn btn-primary auth-submit-btn" data-i18n="auth_btn_signup">Create Patient Profile</button>
            </form>

            <div class="auth-footer-links">
                <span data-i18n="auth_have_account">Already have an account?</span> 
                <a href="/login" class="auth-link" data-i18n="auth_link_login">Sign In here →</a>
            </div>
        </div>
    </main>

    <script>
        const AUTH_LANGS = {
            en: {
                nav_brand: "AURA Platform",
                badge_offline: "Local Offline",
                nav_home: "← Back to Home",
                auth_tab_login: "Sign In",
                auth_tab_signup: "Create Patient Profile",
                signup_subtitle: "Set up your personal offline digital health profile with clinical baseline records.",
                auth_lbl_name: "Full Name",
                auth_lbl_age: "Age",
                auth_lbl_blood: "Blood Group",
                auth_lbl_email: "Email / Roll Number",
                auth_lbl_password: "Password",
                auth_btn_signup: "Create Patient Profile",
                auth_have_account: "Already have an account?",
                auth_link_login: "Sign In here →"
            },
            hi: {
                nav_brand: "ऑरा प्लेटफॉर्म (AURA)",
                badge_offline: "ऑफ़लाइन मोड",
                nav_home: "← होम पर वापस जाएं",
                auth_tab_login: "साइन इन (Login)",
                auth_tab_signup: "रोगी प्रोफाइल बनाएं",
                signup_subtitle: "नैदानिक रिकॉर्ड के साथ अपना व्यक्तिगत ऑफ़लाइन डिजिटल स्वास्थ्य कार्ड बनाएं।",
                auth_lbl_name: "पूरा नाम",
                auth_lbl_age: "उम्र",
                auth_lbl_blood: "ब्लड ग्रुप",
                auth_lbl_email: "ईमेल / रोल नंबर",
                auth_lbl_password: "पासवर्ड",
                auth_btn_signup: "रोगी प्रोफाइल बनाएं",
                auth_have_account: "पहले से खाता है?",
                auth_link_login: "यहाँ साइन इन करें →"
            },
            te: {
                nav_brand: "AURA ప్లాట్‌ఫామ్",
                badge_offline: "ఆఫ్‌లైన్ మోడ్",
                nav_home: "← హోమ్‌కి తిరిగి వెళ్లండి",
                auth_tab_login: "సైన్ ఇన్ (Login)",
                auth_tab_signup: "రోగి ప్రొఫైల్ సృష్టించండి",
                signup_subtitle: "క్లినికల్ రికార్డులతో మీ వ్యక్తిగత ఆఫ్‌లైన్ డిజిటల్ హెల్త్ ప్రొఫైల్‌ని సెటప్ చేయండి.",
                auth_lbl_name: "పూర్తి పేరు",
                auth_lbl_age: "వయస్సు",
                auth_lbl_blood: "బ్లడ్ గ్రూప్",
                auth_lbl_email: "ఈమెయిల్ / రోల్ నంబర్",
                auth_lbl_password: "పాస్‌వర్డ్",
                auth_btn_signup: "రోగి ప్రొఫైల్ సృష్టించండి",
                auth_have_account: "ఇప్పటికే ఖాతా ఉందా?",
                auth_link_login: "ఇక్కడ లాగిన్ చేయండి →"
            }
        };

        function setAuthLanguage(lang) {
            const dict = AUTH_LANGS[lang] || AUTH_LANGS.en;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const k = el.getAttribute("data-i18n");
                if (dict[k]) el.textContent = dict[k];
            });
            localStorage.setItem("aura_lang", lang);
        }

        const langSel = document.getElementById("standalone-lang-selector");
        if (langSel) {
            const saved = localStorage.getItem("aura_lang") || "en";
            langSel.value = saved;
            setAuthLanguage(saved);
            langSel.addEventListener("change", (e) => setAuthLanguage(e.target.value));
        }

        document.getElementById("standalone-signup-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const name = document.getElementById("signup-name-input").value.trim();
            const age = document.getElementById("signup-age-input").value;
            const blood = document.getElementById("signup-blood-input").value;
            const id = document.getElementById("signup-id-input").value.trim();
            const pw = document.getElementById("signup-pw-input").value;

            const user = { name, age, blood, identifier: id, password: pw };
            let users = [];
            try { users = JSON.parse(localStorage.getItem("aura_users_db") || "[]"); } catch (err) {}
            users.push(user);
            localStorage.setItem("aura_users_db", JSON.stringify(users));
            localStorage.setItem("aura_active_user", JSON.stringify(user));
            window.location.href = "/";
        });
    </script>
</body>
</html>
